spring:
  application:
    name: crypto-trading-system
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:crypto_trading}?useUnicode=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME:crypto_user}
    password: ${MYSQL_PASSWORD:your_mysql_password_here}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 1000
    open-in-view: false
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:your_redis_password_here}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

  mail:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
              required: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000

# JWT Configuration
jwt:
  secret-key: ${JWT_SECRET_KEY:your_jwt_secret_key_here_minimum_256_bits}
  expiration: ${JWT_EXPIRATION:1800000}
  refresh-expiration: 604800000

# Encryption Configuration
encryption:
  aes-secret-key: ${AES_SECRET_KEY:your_aes_secret_key_here_32_characters}

# Upbit API Configuration
upbit:
  api:
    url: https://api.upbit.com/v1
    access-key: ${UPBIT_ACCESS_KEY:}
    secret-key: ${UPBIT_SECRET_KEY:}
  websocket:
    url: wss://api.upbit.com/websocket/v1

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    root: INFO
    com.cryptotrading: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.SQL_SLOW: WARN
    org.hibernate.stat: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/crypto-trading.log
    max-size: 10MB
    max-history: 30

# 알림 설정
notification:
  discord:
    enabled: ${DISCORD_ENABLED:false}
    webhook-url: ${DISCORD_WEBHOOK_URL:}

# App Email Settings
app:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${SMTP_USERNAME:noreply@cryptobot.com}
    from-name: 코인 자동매매 시스템

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ============================================
# Day 24: AI 뉴스 분석 설정 (2025-12-29 추가)
# ============================================
news:
  collection:
    enabled: true
    # 3시간마다 실행 (cron 표현식)
    cron: "0 0 */3 * * *"
    # 데이터 보관 기간 (일)
    retention-days: 7
  analysis:
    # ⭐ Day 25: Gemini API 연동 (2025-12-29 추가)
    enabled: ${GEMINI_API_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.0-flash
    # API 호출 제한 (분당 15회 무료 한도)
    rate-limit-per-minute: 10
    # 요청 타임아웃 (초)
    timeout-seconds: 30

# ============================================
# Groq API 설정 (Gemini 대체 - 2025-12-29 추가)
# ============================================
groq:
  api:
    key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    base-url: https://api.groq.com/openai/v1/chat/completions
    timeout: 60

# ============================================
# Phase 2: 한국투자증권 KIS API 설정 (Day 50 추가)
# ============================================
kis:
  api:
    # 모의투자: https://openapivts.koreainvestment.com:29443
    # 실전투자: https://openapi.koreainvestment.com:9443
    base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    account-no: ${KIS_ACCOUNT_NO:}
    mock-mode: ${KIS_MOCK_MODE:true}
  websocket:
    url: ${KIS_WS_URL:ws://ops.koreainvestment.com:31000}
  token:
    # 토큰 유효시간: 24시간이지만, 안전을 위해 23시간마다 갱신
    refresh-hours: ${KIS_TOKEN_REFRESH_HOURS:23}